name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests (chromium only)
        run: npx playwright test --project=chromium --reporter=dot --reporter=github --reporter=html

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload raw test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Post job summary link
        if: always()
        run: |
          echo "### Playwright Report" >> $GITHUB_STEP_SUMMARY || true
          echo "- HTML report artifact: playwright-report" >> $GITHUB_STEP_SUMMARY || true
          echo "- Raw test-results artifact: test-results" >> $GITHUB_STEP_SUMMARY || true
