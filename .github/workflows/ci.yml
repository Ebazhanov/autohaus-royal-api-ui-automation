name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # Required runner specification
    runs-on: ubuntu-latest
    # Use Playwright official Docker image which includes browsers preinstalled
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-focal
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
