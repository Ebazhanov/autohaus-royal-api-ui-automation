name: CI (Functional)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install ONLY Chromium
        run: npx playwright install chromium

      - name: Run E2E & UI Performance Tests
        run: |
          npx playwright test --project=chromium --reporter=dot --reporter=github --reporter=html 2>&1 | tee playwright-output.txt

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Post summary
        if: always()
        run: |
          OUT=playwright-output.txt
          PASSED=$(grep -Eo '[0-9]+ passed' $OUT | grep -Eo '[0-9]+' || echo 0)
          FAILED=$(grep -Eo '[0-9]+ failed' $OUT | grep -Eo '[0-9]+' || echo 0)
          SKIPPED=$(grep -Eo '[0-9]+ skipped' $OUT | grep -Eo '[0-9]+' || echo 0)
          {
            echo "### 🎭 Functional Tests"
            echo "- Passed: $PASSED | Failed: $FAILED | Skipped: $SKIPPED"
          } >> $GITHUB_STEP_SUMMARY