name: CI (Functional)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ONLY Chromium
        run: npx playwright install chromium

      - name: Run E2E & UI Performance Tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Generate Step Summary
        if: always()
        run: |
          if [ -f results.json ]; then
            PASSED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('results.json')).stats.expected || 0)")
            FAILED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('results.json')).stats.unexpected || 0)")
            SKIPPED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('results.json')).stats.skipped || 0)")
          
            echo "### 🎭 Functional Tests Result" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | Failed | Skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ $PASSED | ❌ $FAILED | ⏭️ $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14