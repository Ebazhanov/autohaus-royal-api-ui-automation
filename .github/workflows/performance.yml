name: Performance & Load Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 API Load Tests
        run: |
          mkdir -p performance-report
          k6 run tests/performance/api/vehicle-k6-load.js --summary-export=performance-report/summary.json

      - name: Post Performance Summary to Step Summary
        if: always()
        run: |
          if [ -f performance-report/summary.json ]; then
            REQ_COUNT=$(jq -r '.metrics.http_reqs.values.count // "N/A"' performance-report/summary.json)
            P95_LATENCY=$(jq -r '(.metrics.http_req_duration.values["p(95)"] | if . then (.*100 | round / 100) else "N/A" end)' performance-report/summary.json)
            AVG_LATENCY=$(jq -r '(.metrics.http_req_duration.values.avg | if . then (.*100 | round / 100) else "N/A" end)' performance-report/summary.json)
            FAIL_RATE=$(jq -r '(.metrics.http_req_failed.values.rate | if . then (.*10000 | round / 100) else 0 end)' performance-report/summary.json)

            echo "### 🚀 k6 API Performance Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Requests** | $REQ_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| **Avg Latency** | ${AVG_LATENCY} ms |" >> $GITHUB_STEP_SUMMARY
            echo "| **p(95) Latency** | ${P95_LATENCY} ms |" >> $GITHUB_STEP_SUMMARY
            echo "| **Failure Rate** | ${FAIL_RATE}% |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload k6 Performance Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: performance-report
          retention-days: 14